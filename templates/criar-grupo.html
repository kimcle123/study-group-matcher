{% extends "base.html" %}
{% block titulo %}Criar grupo{% endblock %}

{% block estilos %}
<style>
.switch{position:relative;display:inline-block;width:38px;height:22px;flex:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--c-surface-2);border-radius:var(--r-full);cursor:pointer;transition:background .15s ease}
.switch span::after{content:'';position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:var(--r-full);background:var(--c-text-3);transition:transform .15s ease, background .15s ease}
.switch input:checked + span{background:var(--c-gold)}
.switch input:checked + span::after{transform:translateX(16px);background:var(--c-on-gold)}
.switch input:focus-visible + span{outline:2px solid var(--c-gold);outline-offset:2px}
</style>
{% endblock %}

{% block conteudo %}
<div class="row-between" style="margin-bottom:var(--s-5)">
  <a href="{{ url_for('grupos') }}" style="color:var(--c-text-2);text-decoration:none;font-size:20px">&times;</a>
  <span class="label" style="margin:0">Novo grupo</span>
</div>

<form method="post" action="{{ url_for('criar_grupo') }}">

  <label class="label" for="nome">Nome do grupo</label>
  <input class="field" id="nome" name="nome" type="text" required>

  <label class="label" for="objetivo" style="margin-top:var(--s-3)">Objetivo</label>
  <textarea class="field" id="objetivo" name="objetivo" required></textarea>
  <span class="field-help">Diz numa frase o que o grupo vai fazer. É o que os outros veem antes de pedir para entrar.</span>

  <label class="label" for="disciplina" style="margin-top:var(--s-3)">Disciplina</label>
  <select class="field" id="disciplina" name="disciplina" required>
    <option value="">Escolhe a disciplina</option>
    {% for d in disciplinas %}<option>{{ d }}</option>{% endfor %}
  </select>

  <label class="label" style="margin-top:var(--s-4)">Como se estuda aqui</label>
  <div class="tags" style="margin-bottom:var(--s-4)">
    {% for e in estilos %}
    <input type="checkbox" class="tag-input" id="estilo-{{ loop.index }}" name="estilos" value="{{ e }}">
    <label class="tag" for="estilo-{{ loop.index }}">{{ e }}</label>
    {% endfor %}
  </div>

  <label class="label" for="max">Máximo de membros</label>
  <input class="field" id="max" name="max" type="number" min="2" max="20" value="6">

  <label class="label" style="margin-top:var(--s-4)">Entrada</label>
  <div class="card stack">
    <div class="row-between">
      <label for="aberto" style="font-size:14px;cursor:pointer">Aberta a todos</label>
      <span class="switch"><input type="checkbox" id="aberto" name="aberto"><span></span></span>
    </div>
    <div class="row-between">
      <label for="aprovar" style="font-size:14px;cursor:pointer">Aprovar cada pedido</label>
      <span class="switch"><input type="checkbox" id="aprovar" name="aprovar" checked><span></span></span>
    </div>
  </div>

  <div class="push-bottom" style="padding-top:var(--s-5)">
    <button class="btn" type="submit">Criar grupo</button>
  </div>

</form>
{% endblock %}
